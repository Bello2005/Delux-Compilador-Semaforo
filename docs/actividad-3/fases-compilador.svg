<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="1520" height="1280" font-family="Liberation Sans, Arial, sans-serif" font-size="13">
  <rect width="760" height="640" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
  </defs>
  <text x="380" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Fases del compilador de DeLuX</text>
  <g fill="none" stroke="#333" stroke-width="1.4">
    <path d="M224 116V148" marker-end="url(#a)"/><path d="M224 220V252" marker-end="url(#a)"/>
    <path d="M224 324V356" marker-end="url(#a)"/><path d="M224 428V460" marker-end="url(#a)"/>
    <path d="M224 516V548" marker-end="url(#a)"/>
    <path d="M424 184H480" marker-end="url(#a)"/><path d="M424 288H480" marker-end="url(#a)"/><path d="M424 392H480" marker-end="url(#a)"/>
  </g>
  <g stroke="#333" stroke-width="1.4">
    <rect x="24" y="60" width="400" height="56" rx="6" fill="#ffffff"/>
    <rect x="24" y="148" width="400" height="72" rx="6" fill="#f2f2f2"/>
    <rect x="24" y="252" width="400" height="72" rx="6" fill="#f2f2f2"/>
    <rect x="24" y="356" width="400" height="72" rx="6" fill="#f2f2f2"/>
    <rect x="24" y="460" width="400" height="56" rx="6" fill="#f2f2f2"/>
    <rect x="24" y="548" width="400" height="56" rx="6" fill="#ffffff" stroke-width="2.2"/>
    <rect x="480" y="156" width="256" height="56" rx="6" fill="#ffffff" stroke-dasharray="5 3"/>
    <rect x="480" y="260" width="256" height="56" rx="6" fill="#ffffff" stroke-dasharray="5 3"/>
    <rect x="480" y="364" width="256" height="56" rx="6" fill="#ffffff" stroke-dasharray="5 3"/>
  </g>
  <g fill="#111">
    <text x="40" y="84" font-weight="bold">Programa fuente (.dlx)</text>
    <text x="40" y="102" font-size="11.5" fill="#333">Lo que escribe el programador, por ejemplo: total = precio * 2</text>
    <text x="40" y="172" font-weight="bold">1. Análisis léxico</text>
    <text x="40" y="190" font-size="11.5" fill="#333">Lee carácter por carácter y arma los tokens:</text>
    <text x="40" y="207" font-size="11.5" fill="#333">ID(total) · IGUAL · ID(precio) · POR · NUM(2)</text>
    <text x="40" y="276" font-weight="bold">2. Análisis sintáctico</text>
    <text x="40" y="294" font-size="11.5" fill="#333">Revisa la forma con la gramática: variable = expresión,</text>
    <text x="40" y="311" font-size="11.5" fill="#333">y que cada si, repetir y mientras cierren con fin</text>
    <text x="40" y="380" font-weight="bold">3. Análisis semántico</text>
    <text x="40" y="398" font-size="11.5" fill="#333">Revisa el sentido: que precio esté definida</text>
    <text x="40" y="415" font-size="11.5" fill="#333">y que no se mezclen textos con números</text>
    <text x="40" y="484" font-weight="bold">4. Generación de código</text>
    <text x="40" y="502" font-size="11.5" fill="#333">Traduce cada instrucción a código Python</text>
    <text x="40" y="572" font-weight="bold">Resultado</text>
    <text x="40" y="590" font-size="11.5" fill="#333">Programa en Python, por ejemplo: total = precio * 2</text>
    <text x="496" y="180" font-weight="bold">Error léxico</text>
    <text x="496" y="198" font-size="11.5" fill="#333">Símbolo que no existe, como @</text>
    <text x="496" y="284" font-weight="bold">Error sintáctico</text>
    <text x="496" y="302" font-size="11.5" fill="#333">Instrucción mal armada: falta entonces</text>
    <text x="496" y="388" font-weight="bold">Error semántico</text>
    <text x="496" y="406" font-size="11.5" fill="#333">Variable que nunca se definió</text>
    <text x="452" y="176" text-anchor="middle" font-size="11.5" fill="#333">falla</text>
    <text x="452" y="280" text-anchor="middle" font-size="11.5" fill="#333">falla</text>
    <text x="452" y="384" text-anchor="middle" font-size="11.5" fill="#333">falla</text>
  </g>
</svg>
